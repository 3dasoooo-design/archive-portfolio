<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFFPRINT — LOFI STUDIO _ PALACE</title>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141416;
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 100px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation Bar */
    .top-nav {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 12px;
    }

    .top-nav a {
      color: #d4d4d8;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      padding: 7px 12px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .top-nav a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
    }

    /* Exact Provided Receipt Container */
    .receipt-paper-wrap {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }

    /* 100% Original Provided Design Image */
    .exact-receipt-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Manual Directing Button Area */
    .direct-action-area {
      padding: 18px 24px 26px;
      background: #ffffff;
      border-top: 1px dotted #cccccc;
    }

    .btn-direct-exhibit {
      width: 100%;
      background-color: #111111;
      color: #ffffff;
      border: 1.5px solid #111111;
      padding: 15px 18px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .btn-direct-exhibit:hover {
      background-color: #ffffff;
      color: #111111;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="exhibition.html">&larr; 3학년 외부전시 목록</a>
  </div>

  <!-- Exact Provided Receipt Image (Untouched Original PDF Design) -->
  <article class="receipt-paper-wrap">
    <img src="assets/lofi_receipt.png?v=20261111_3" alt="LOFI STUDIO _ PALACE Receipt" class="exact-receipt-img" id="exact-receipt-img" />

    <!-- Manual Directing Button to Individual Work Page -->
    <div class="direct-action-area">
      <a href="project.html?id=palace" class="btn-direct-exhibit" id="btn-enter-project">
        <span id="btn-enter-label">➔ LOFI STUDIO _ PALACE 작품 상세 페이지로 이동</span>
        <span>&rarr;</span>
      </a>
    </div>
  </article>

  <script src="js/data.js?v=20261116_14"></script>
  <script>
    const RECEIPT_IMAGE_MAP = {
      "palace": "assets/lofi_receipt.png?v=20261117_1",
      "lofi": "assets/lofi_receipt.png?v=20261117_1",
      "lofi-studio": "assets/lofi_receipt.png?v=20261117_1",
      "dongwha": "assets/dongwha_receipt.png?v=20261117_1",
      "galaxy": "assets/galaxy_receipt.png?v=20261117_1",
      "hwayo": "assets/hwayo_receipt.png?v=20261117_1",
      "karrot": "assets/karrot_receipt.png?v=20261117_1",
      "daangn": "assets/karrot_receipt.png?v=20261117_1",
      "bilguun-team": "assets/lego_receipt.png?v=20261117_1",
      "lego": "assets/lego_receipt.png?v=20261117_1",
      "yoshida-porter": "assets/porter_receipt.png?v=20261117_1",
      "porter": "assets/porter_receipt.png?v=20261117_1",
      "dedar": "assets/dedar_receipt.png?v=20261117_1",
      "gopherwood": "assets/gopherwood_receipt.png?v=20261117_1",
      "tekla-minseo": "assets/tekla_minseo_receipt.png?v=20261117_1",
      "tekla": "assets/tekla_receipt.png?v=20261117_1",
      "tekla-house": "assets/tekla_receipt.png?v=20261117_1",
      "tekla-3": "assets/tekla_receipt.png?v=20261117_1",
      "marshall": "assets/marshall_receipt.png?v=20261117_1",
      "marshall-livehouse": "assets/marshall_receipt.png?v=20261117_1",
      "marshall-seoul": "assets/marshall_receipt.png?v=20261117_1",
      "headspace": "assets/headspace_receipt.png?v=20261117_1",
      "gachi-ieum": "assets/gachi_ieum_receipt.png?v=20261117_1",
      "hanyul": "assets/hanyul_receipt.png?v=20261117_1",
      "ggott": "assets/ggott_receipt.png?v=20261117_1",
      "medicube": "assets/medicube_receipt.png?v=20261117_1",
      "bang-olufsen": "assets/bang_olufsen_receipt.png?v=20261117_1"
    };

    const ID_ALIASES = {
      "lego": "bilguun-team",
      "bilguun": "bilguun-team",
      "lofi": "palace",
      "lofi-studio": "palace",
      "karrot": "daangn",
      "porter": "yoshida-porter",
      "tekla-seochon": "tekla",
      "tekla-house": "tekla",
      "tekla_house": "tekla",
      "tekla-3": "tekla",
      "tekla3": "tekla",
      "tekla-team": "tekla",
      "marshall-livehouse": "marshall",
      "marshall_livehouse": "marshall",
      "marshall-seoul": "marshall",
      "marshalllivehouse": "marshall",
      "marshall-team": "marshall"
    };

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const lastSeg = pathParts.length > 0 ? pathParts[pathParts.length - 1] : "";
      const pathId = (lastSeg && lastSeg !== "receipt" && lastSeg !== "receipt.html") ? lastSeg : "";
      const rawId = (params.get("id") || pathId || "palace").toLowerCase();
      const idParam = ID_ALIASES[rawId] || rawId;
      const projects = window.PROJECTS_DATA || [];
      const found = projects.find(p => p.id.toLowerCase() === idParam) || projects.find(p => p.id === "palace");

      const receiptImgEl = document.getElementById("exact-receipt-img");
      if (receiptImgEl) {
        const mappedSrc = RECEIPT_IMAGE_MAP[idParam] || RECEIPT_IMAGE_MAP[rawId] || (found && found.receiptImg ? `${found.receiptImg}?v=20261117_1` : "assets/lofi_receipt.png?v=20261117_1");
        receiptImgEl.src = mappedSrc;
        if (found) {
          receiptImgEl.alt = `${found.brand || found.title} Receipt`;
          document.title = `OFFPRINT — ${found.brand || found.title}`;
        }
      }

      if (found) {
        const btnEnter = document.getElementById("btn-enter-project");
        const btnLabel = document.getElementById("btn-enter-label");
        if (btnEnter && btnLabel) {
          btnEnter.href = `project.html?id=${found.id}`;
          btnLabel.textContent = `➔ ${found.brand || found.title} 작품 상세 페이지로 이동`;
        }
      }
    });
  </script>
</body>
</html>
