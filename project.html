<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-badge"></span>
        GACHON.IA Archive
      </a>
      <nav class="site-nav">
        <a href="about.html" class="nav-link">About</a>
        <a href="index.html" class="nav-link active">Project</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="project-detail-wrap">
      
      <!-- Top Title Bar -->
      <div class="project-header-bar">
        <h1 class="project-main-title" id="project-title">Loading Project...</h1>
        <div class="project-breadcrumbs" id="project-breadcrumb">A반 / 화요 (Hwayo) / 장효진, 하은지</div>

      <!-- High-Impact Image Slider -->
      <div class="project-slider" id="project-slider">
        <div class="slider-track" id="slider-track">
          <!-- Populated by project.js -->
        </div>

        <!-- Slider Controls -->
        <button class="slider-nav-btn slider-prev" id="slider-prev" aria-label="Previous Slide">&#x2190;</button>
        <button class="slider-nav-btn slider-next" id="slider-next" aria-label="Next Slide">&#x2192;</button>

        <!-- Slider Dots -->
        <div class="slider-indicators" id="slider-indicators"></div>
      </div>

      <!-- Specification Table -->
      <table class="project-spec-table">
        <tbody id="project-spec-body">
          <!-- Populated by project.js -->
        </tbody>
      </table>

      <!-- Prev / Next Project Navigation Bar -->

        <a href="#" class="pagination-link" id="prev-project-link">&#x2190; PREVIOUS PROJECT</a>

      <div class="footer-credits">GACHON UNIVERSITY INTERIOR ARCHITECTURE</div>
    </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/project.js"></script>

</html>
