<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GACHON.IA Archive — 가천대학교 공과대학 실내건축학과 전체 전시 아카이브 마스터 포털">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GACHON.IA Archive — Exhibitions">
  <meta property="og:description" content="가천대학교 실내건축학과 연도별 외부전시, 졸업전시, 과제전 아카이브">
  <meta property="og:image" content="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=1200&auto=format&fit=crop&q=80">

  <title>Exhibitions — GACHON.IA Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-badge"></span>
        GACHON.IA Archive
      </a>
      <nav class="site-nav">
        <a href="about.html" class="nav-link">About</a>
        <a href="index.html" class="nav-link active">Exhibitions</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <!-- Portal Header & Intro -->
    <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
      <h1 style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em;">
        Exhibition Archive Directory
      </h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        가천대학교 실내건축학과의 연도별 외부전시, 졸업전시, 스튜디오 과제전 기록 보관소입니다.
      </p>
    </div>

    <!-- Category & Filter Bar -->
    <div class="category-filter-bar">
      <div class="category-tags">
        <button class="filter-btn active" data-filter="All">All (전체)</button>
        <button class="filter-btn" data-filter="외부전시">외부전시</button>
        <button class="filter-btn" data-filter="졸업전시">졸업전시</button>
        <button class="filter-btn" data-filter="과제전">과제전</button>
      </div>
      <div class="archive-stats" id="portal-stats">
        EXHIBITIONS COUNT: 4 ARCHIVES
      </div>
    </div>

    <!-- Master Exhibitions Table -->
    <div id="portal-grid-wrap">
      <!-- Generated via js/portal.js -->
    </div>
  </main>

  <!-- Signature Floating Cursor Preview Card -->
  <div class="cursor-preview-card" id="cursor-preview-card">
    <img src="" alt="Exhibition Preview" class="cursor-preview-img" id="cursor-preview-img">
    <div class="cursor-preview-meta" id="cursor-preview-meta">
      <span>Exhibition</span>
      <span>2026</span>
    </div>
  </div>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>&copy; GACHON.IA Archive. All Rights Reserved.</div>
      <div class="footer-credits">DEPARTMENT OF INTERIOR ARCHITECTURE, GACHON UNIVERSITY</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
