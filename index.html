  <meta property="og:type" content="website">
  <meta property="og:title" content="GACHON.IA Archive">
  <meta property="og:description" content="가천대학교 실내건축학과 2학기 브랜드 공간 전시 아카이브">
  <meta property="og:image" content="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=1200&auto=format&fit=crop&q=80">

  <title>GACHON.IA Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-badge"></span>
        GACHON.IA Archive
      </a>
      <nav class="site-nav">
        <a href="about.html" class="nav-link">About</a>
        <a href="index.html" class="nav-link active">Project</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Category & Filter Bar -->
    <div class="category-filter-bar">
      <div class="category-tags">
        <button class="filter-btn active" data-filter="All">All (전체 18개 팀)</button>
        <button class="filter-btn" data-filter="A반">A반 (6)</button>
        <button class="filter-btn" data-filter="B반">B반 (5)</button>
        <button class="filter-btn" data-filter="C반">C반 (7)</button>
      </div>
      <div class="archive-stats" id="archive-stats">
        EXHIBITION TEAMS: 18 TEAMS
      </div>
    </div>

    <!-- 3-Column Archive Table Grid (A반 -> B반 -> C반) -->
    <div class="archive-grid-wrap" id="archive-grid-wrap">
      <!-- Generated via js/main.js -->
    </div>
  </main>

  <!-- Signature Floating Cursor Preview Card -->
  <div class="cursor-preview-card" id="cursor-preview-card">
    <img src="" alt="Project Preview" class="cursor-preview-img" id="cursor-preview-img">
    <div class="cursor-preview-meta" id="cursor-preview-meta">
      <span>Spatial</span>
      <span>2026</span>
    </div>
  </div>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>&copy; GACHON.IA Archive. All Rights Reserved.</div>
      <div class="footer-credits">GACHON UNIVERSITY INTERIOR ARCHITECTURE</div>
